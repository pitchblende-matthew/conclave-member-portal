name: Warm intros

# Webflow Cloud has no cron, so GitHub Actions plays scheduler. Runs daily: the
# runner drafts each new month's pairings (and notifies admins to review), then
# auto-sends a draft that's been sitting a few days if an admin hasn't sent it.
# Idempotent per month (keyed by round). Reuses the digest secret + email config.
on:
  schedule:
    # Daily at 09:00 ET (14:00 UTC).
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger warm intros
        env:
          DIGEST_SECRET: ${{ secrets.DIGEST_SECRET }}
          # Override via repo variable INTROS_URL if the portal moves.
          INTROS_URL: ${{ vars.INTROS_URL || 'https://www.jointheconclave.com/portal/api/intros/run' }}
        run: |
          if [ -z "$DIGEST_SECRET" ]; then
            echo "::error::DIGEST_SECRET repo secret is not set."
            exit 1
          fi
          url="${INTROS_URL}?key=${DIGEST_SECRET}"
          echo "GET ${INTROS_URL}"
          status=$(curl -sS -o response.json -w "%{http_code}" "$url")
          echo "HTTP ${status}"
          echo "Response: $(cat response.json)"
          case "$status" in
            2*) echo "Intro runner accepted the request." ;;
            *)  echo "::error::Intro runner returned HTTP ${status}"; exit 1 ;;
          esac
